  - {id: mid_05, tier: mid, text: "a man teaching a classroom of students"}
  - {id: mid_06, tier: mid, text: "a man jogging through a neighborhood"}
  - {id: mid_07, tier: mid, text: "a man shopping at a grocery store"}
  - {id: mid_08, tier: mid, text: "a man playing guitar at a small venue"}
  - {id: mid_09, tier: mid, text: "a man fishing on a lake"}
  - {id: mid_10, tier: mid, text: "a man working at a desk in an office"}

  # --- far (10) ---
  - {id: far_01, tier: far, text: "a woman gardening in a backyard"}
