# Source for the FROZEN evaluation prompt set.
#
# `digital-ghost init-eval-prompts` reads this file once and writes
# data/eval_prompts.json. After that, the pipeline only ever reads the
# frozen JSON file — this source file is not re-read mid-study, so editing
# it after prompts have been written has no effect until you deliberately
# regenerate (which the CLI refuses to do without --force, to protect
# comparability across runs already completed).
#
# Tiers are semantic distance from the subject's typical context:
#   near — male public-speaking / political-adjacent scenes, closest to the
#          training images' scene grammar
#   mid  — male, everyday non-political scenes
#   far  — different gender and/or unrelated activity, most distant

prompts:
  # --- near (10) ---
  - {id: near_01, tier: near, text: "a man speaking at a podium"}
  - {id: near_02, tier: near, text: "a man in a suit giving a speech to a crowd"}
  - {id: near_03, tier: near, text: "a man addressing an audience from a stage"}
  - {id: near_04, tier: near, text: "a man being interviewed by a reporter"}
  - {id: near_05, tier: near, text: "a man at an outdoor political rally"}
  - {id: near_06, tier: near, text: "a man debating on a panel"}
  - {id: near_07, tier: near, text: "a man testifying before a committee"}
  - {id: near_08, tier: near, text: "a man at a news conference"}
  - {id: near_09, tier: near, text: "a man greeting supporters after a speech"}
  - {id: near_10, tier: near, text: "a man in a suit walking into a building surrounded by press"}

  # --- mid (10) ---
