# Frozen LoRA/SDXL hyperparameters — identical for all 45 sweep cells.
# Arm, dose, and per-cell seed are the ONLY variables across runs; changing
# anything in this file invalidates comparability across the whole sweep.

base_model: stabilityai/stable-diffusion-xl-base-1.0

lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0

optimizer:
  lr: 1.0e-4
  lr_scheduler: constant
  lr_warmup_steps: 0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8

resolution: 1024
batch_size: 1
gradient_accumulation_steps: 4
max_train_steps: 1000
mixed_precision: fp16
gradient_checkpointing: true

# Process seed: controls weight init / dropout / batch shuffling during
# training. Distinct from the per-cell data-sampling seed in study.yaml,
# which controls which images are drawn into a cell's dose subsample.
seed: 42

checkpointing_steps: 500
caption_dropout_rate: 0.0

# Mid-training sample images, so a collapsing LoRA is visible early rather
# than after 45 cells have run. The vendored trainer validates per epoch, not
# per step (there is no --validation_steps upstream), so cell.py converts this
# into the nearest epoch interval from the cell's dataset size and effective
# batch size. At these dose sizes an epoch is a handful of steps, so the
# granularity loss is small.
#
# The prompt must stay neutral and unnamed, exactly like the eval prompts: a
# sample prompt naming the subject would defeat the point of the study.
validation:
  every_n_steps: 250
  num_images: 2
  prompt: "a man speaking at a podium"
